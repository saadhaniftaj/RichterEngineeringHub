version: 1
frontend:
  phases:
    preBuild:
      commands:
        - if [ -d "frontend/spare-parts-hub" ]; then cd frontend/spare-parts-hub; fi && npm ci
    build:
      commands:
        - if [ -d "frontend/spare-parts-hub" ]; then cd frontend/spare-parts-hub; fi && npm run build
  artifacts:
    baseDirectory: frontend/spare-parts-hub/.next
    files:
      - "**/*"
  cache:
    paths:
      - frontend/spare-parts-hub/node_modules/**/*
      - frontend/spare-parts-hub/.next/cache/**/*
